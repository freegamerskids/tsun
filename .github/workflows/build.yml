name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the build to a release when a v* tag is pushed

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-latest
    # Video playback links FFmpeg 8 (`ffmpeg-next` 8.x needs the 8.x headers). Fedora ships
    # it as `ffmpeg-free`, so the build runs in a Fedora container instead of on the Ubuntu
    # runner, whose repositories only carry older FFmpeg releases. Pinned to 44: Fedora 45's
    # FFmpeg 9 headers do not compile with `ffmpeg-next` 8.x. Move both together.
    container: fedora:44
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake perl-core git tar xz findutils pkgconf-pkg-config \
            cargo rust clang clang-devel \
            alsa-lib-devel ffmpeg-free-devel \
            wayland-devel libxkbcommon-devel libX11-devel libxcb-devel

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/tsun dist/
          cp tsun.desktop README.md dist/
          tar -C dist -czf tsun-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: tsun-linux-x86_64
          path: tsun-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tsun-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
